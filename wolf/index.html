<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>WOLF</title><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;background:#000;overflow:hidden}body{display:flex;align-items:center;justify-content:center}canvas{display:block;image-rendering:pixelated;touch-action:none}.menu-btn{position:fixed;top:8px;right:8px;padding:6px 12px;background:rgba(0,0,0,0.6);color:#fff;border:1px solid #888;border-radius:3px;font:12px monospace;cursor:pointer;z-index:9999}.menu-btn:hover{background:rgba(0,0,0,0.8)}</style></head><body><canvas id="c"></canvas><button class="menu-btn" onclick="window.location.href='../'">⊞ Menu</button><script>'use strict';const PX_W=200,PX_H=125,FOV=Math.PI/3,MAX_DEPTH=24;const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),DPR=window.devicePixelRatio||1;const px=document.createElement('canvas'),pxCtx=px.getContext('2d');px.width=PX_W;px.height=PX_H;pxCtx.imageSmoothingEnabled=false;const frame=pxCtx.createImageData(PX_W,PX_H),frameData=frame.data;const frame32=new Uint32Array(frameData.buffer);let SCALE=1;function resize(){SCALE=Math.max(1,Math.min(window.innerWidth/PX_W,window.innerHeight/PX_H));canvas.width=Math.round(PX_W*SCALE*DPR);canvas.height=Math.round(PX_H*SCALE*DPR);canvas.style.width=Math.round(PX_W*SCALE)+'px';canvas.style.height=Math.round(PX_H*SCALE)+'px';ctx.setTransform(1,0,0,1,0,0);ctx.scale(DPR,DPR);ctx.imageSmoothingEnabled=false}window.addEventListener('resize',resize);resize();const C={ceiling:[40,42,56],floor:[70,60,50],wallNS:[180,60,40],wallEW:[130,40,28],wall2NS:[80,100,130],wall2EW:[55,75,100],exitNS:[90,200,90],exitEW:[60,140,60],hud:[240,230,210],hudBg:[12,14,20],red:[220,50,40],enemyA:[180,180,60],enemyAd:[110,110,30],enemyB:[200,60,200],enemyBd:[120,30,120],enemyH:[200,60,50],enemyHd:[120,30,25],pickH1:[235,235,235],pickH2:[150,150,150],pickH3:[210,40,40],pickA1:[140,95,50],pickA2:[90,60,30],pickA3:[240,200,80],pickK1:[230,190,60],pickK2:[150,120,35],pickK3:[255,250,220],black:[10,10,10],white:[240,240,240],muzzle:[255,220,100],bullet:[255,255,200]};function rgb(c){return(255<<24)|(c[2]<<16)|(c[1]<<8)|c[0]}const MAP_W=16,MAP_H=16;const LEVELS=[{rows:['################','#.....#........#','#.....#........#','#.........###..#','#.....#...#....#','##.####...#....#','#.........#....#','#.........###..#','#.....#####....#','#.....#........#','#..............#','#######...######','#.........#....#','#.........#....#','#.........D...E#','################'],spawn:{x:3.5,y:3.5,angle:0},enemies:[{x:9.5,y:2.5,type:'A'},{x:13.5,y:6.5,type:'B'},{x:8.5,y:12.5,type:'A'},{x:12.5,y:9.5,type:'H'}],pickups:[{x:2.5,y:13.5,kind:'key'},{x:4.5,y:9.5,kind:'health'},{x:8.5,y:1.5,kind:'ammo'}]},{rows:['################','#......#.......#','#......#.......#','#..##..#..##...#','#..#...#...#...#','#..#...#...#...#','#..##..#..##...#','#..............#','#......#.......#','####.#####D#####','#......#.......#','#......#.......#','#......#.......#','#......#......E#','#......#.......#','################'],spawn:{x:2,y:1.5,angle:Math.PI/2},enemies:[{x:12.5,y:1.5,type:'A'},{x:12.5,y:7.5,type:'H'},{x:3.5,y:12.5,type:'H'},{x:12.5,y:12,type:'B'},{x:5.5,y:7.5,type:'A'}],pickups:[{x:2.5,y:13.5,kind:'key'},{x:5.5,y:4.5,kind:'health'},{x:13.5,y:4.5,kind:'ammo'},{x:5.5,y:13.5,kind:'ammo'}]},{rows:['################','#..............#','#.####.####.##.#','#.#..#.####..#.#','#.#..#.####..#.#','#.#..D.####..#.#','#.#..#.####..#.#','#.#..#.####..#.#','#.####.####..#.#','#..............#','#.##########.#.#','#.#........#.#.#','#.#........D.#.#','#.#...E....#.#.#','#.#........#.#.#','################'],spawn:{x:1.5,y:1.5,angle:0},enemies:[{x:8.5,y:1.5,type:'B'},{x:6.5,y:9.5,type:'A'},{x:1.5,y:8.5,type:'H'},{x:12.5,y:13.5,type:'H'},{x:3.5,y:12.5,type:'H'},{x:8.5,y:12.5,type:'B'}],pickups:[{x:14.5,y:12.5,kind:'key'},{x:3.5,y:4.5,kind:'health'},{x:3.5,y:6.5,kind:'ammo'},{x:8.5,y:9.5,kind:'ammo'},{x:12.5,y:14.5,kind:'health'}]}];function parseLevelMap(rows){const m=new Array(MAP_W*MAP_H);const code={'#':1,'.':0,'D':2,'E':3};for(let y=0;y<MAP_H;y++){for(let x=0;x<MAP_W;x++){m[y*MAP_W+x]=code[rows[y][x]]}}return m}for(const L of LEVELS)L.map=parseLevelMap(L.rows);let map=LEVELS[0].map.slice(),levelIdx=0,levelEntry={hp:100,ammo:32};function mapAt(x,y){if(x<0||x>=MAP_W||y<0||y>=MAP_H)return 1;return map[y*MAP_W+x]}function isWall(t){return t===1||t===2||t===9}function isExit(t){return t===3}function isBlocking(t){return isWall(t)}const player={x:3.5,y:3.5,angle:0,hp:100,ammo:32,hasKey:false,fireCooldown:0,hurtFlash:0,muzzleFlash:0};let message='',messageT=0;function setMessage(s){message=s;messageT=1.4}const MOVE_SPEED=2.6,TURN_SPEED=2.4,FIRE_RATE=0.25,FIRE_DAMAGE=25,FIRE_RANGE=12;const ENEMY_DEFS={A:{hp:50,damage:8,range:8,fireDelay:1.4,color:C.enemyA,dark:C.enemyAd},B:{hp:100,damage:14,range:10,fireDelay:1,color:C.enemyB,dark:C.enemyBd},H:{hp:40,damage:12,range:11,fireDelay:0.9,speed:2.1,color:C.enemyH,dark:C.enemyHd}};let enemies=[],pickups=[],bullets=[];function loadLevel(i){const L=LEVELS[i];map=L.map.slice();player.x=L.spawn.x;player.y=L.spawn.y;player.angle=L.spawn.angle;player.hasKey=false;player.fireCooldown=0;player.hurtFlash=0;player.muzzleFlash=0;enemies=L.enemies.map(e=>({x:e.x,y:e.y,type:e.type,hp:ENEMY_DEFS[e.type].hp,cooldown:0.5+Math.random(),alive:true,hurt:0,hunting:false,tx:0,ty:0}));pickups=L.pickups.map(p=>({x:p.x,y:p.y,kind:p.kind,taken:false}));bullets=[];message='';messageT=0}const S={MENU:0,PLAY:1,DEAD:2,WIN:3,CLEAR:4};let state=S.MENU,awaitingRelease=false;const keys={};window.addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyW','KeyA','KeyS','KeyD','KeyQ','KeyE'].includes(e.code)){e.preventDefault()}});window.addEventListener('keyup',e=>{keys[e.code]=false});let leftTouch=null,rightTouch=null,firePending=false;canvas.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches){const half=window.innerWidth/2;if(t.clientX<half){if(!leftTouch)leftTouch={id:t.identifier,ox:t.clientX,oy:t.clientY,x:t.clientX,y:t.clientY}}else{if(!rightTouch)rightTouch={id:t.identifier,lastX:t.clientX,lastY:t.clientY,startX:t.clientX,startY:t.clientY,startTime:performance.now()}}}if(state===S.MENU)tryStart();if(state===S.DEAD||state===S.WIN||state===S.CLEAR)tryStart()},{passive:false});canvas.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){if(leftTouch&&t.identifier===leftTouch.id){leftTouch.x=t.clientX;leftTouch.y=t.clientY}else if(rightTouch&&t.identifier===rightTouch.id){rightTouch.lastX=t.clientX;rightTouch.lastY=t.clientY}}},{passive:false});canvas.addEventListener('touchend',e=>{e.preventDefault();for(const t of e.changedTouches){if(leftTouch&&t.identifier===leftTouch.id)leftTouch=null;else if(rightTouch&&t.identifier===rightTouch.id){const dt=performance.now()-rightTouch.startTime,dx=t.clientX-rightTouch.startX,dy=t.clientY-rightTouch.startY,dist=Math.hypot(dx,dy);if(dt<250&&dist<14)firePending=true;rightTouch=null}}},{passive:false});function tryStart(){if(awaitingRelease)return;if(state===S.MENU||state===S.WIN){startGame()}else if(state===S.DEAD){retryLevel()}else if(state===S.CLEAR){advanceLevel()}}function startGame(){levelIdx=0;player.hp=100;player.ammo=32;levelEntry={hp:100,ammo:32};loadLevel(0);awaitingRelease=false;state=S.PLAY}function retryLevel(){player.hp=levelEntry.hp;player.ammo=levelEntry.ammo;loadLevel(levelIdx);awaitingRelease=false;state=S.PLAY}function advanceLevel(){levelIdx++;levelEntry={hp:player.hp,ammo:player.ammo};loadLevel(levelIdx);awaitingRelease=false;state=S.PLAY}function lineOfSight(x0,y0,x1,y1){const dx=x1-x0,dy=y1-y0,dist=Math.hypot(dx,dy);if(dist<0.01)return true;const steps=Math.ceil(dist*8);for(let i=1;i<steps;i++){const t=i/steps,cx=x0+dx*t,cy=y0+dy*t;if(isBlocking(mapAt(Math.floor(cx),Math.floor(cy))))return false}return true}function updatePlayer(dt){let forward=0,strafe=0,turn=0;if(keys['KeyW']||keys['ArrowUp'])forward+=1;if(keys['KeyS']||keys['ArrowDown'])forward-=1;if(keys['KeyA'])strafe-=1;if(keys['KeyD'])strafe+=1;if(keys['ArrowLeft']||keys['KeyQ'])turn-=1;if(keys['ArrowRight']||keys['KeyE'])turn+=1;if(leftTouch){const dx=leftTouch.x-leftTouch.ox,dy=leftTouch.y-leftTouch.oy,mag=Math.hypot(dx,dy),dead=8;if(mag>dead){const sx=dx/Math.max(mag,60),sy=dy/Math.max(mag,60);strafe+=Math.max(-1,Math.min(1,sx));forward+=Math.max(-1,Math.min(1,-sy))}}if(rightTouch){const dx=rightTouch.lastX-rightTouch.startX,dead=10,fullScale=80;if(Math.abs(dx)>dead){const sign=dx>0?1:-1,mag=Math.min(1,(Math.abs(dx)-dead)/(fullScale-dead));turn+=sign*mag}}player.angle+=turn*TURN_SPEED*dt;const cosA=Math.cos(player.angle),sinA=Math.sin(player.angle);let mvx=(cosA*forward-sinA*strafe)*MOVE_SPEED*dt,mvy=(sinA*forward+cosA*strafe)*MOVE_SPEED*dt;function passable(cx,cy){const t=mapAt(cx,cy);if(t===2){if(player.hasKey){map[cy*MAP_W+cx]=0;setMessage('DOOR OPENED');return true}setMessage('NEED KEY');return false}return!isBlocking(t)}const PAD=0.18;let nx=player.x+mvx;if(passable(Math.floor(nx+Math.sign(mvx)*PAD),Math.floor(player.y))){player.x=nx}let ny=player.y+mvy;if(passable(Math.floor(player.x),Math.floor(ny+Math.sign(mvy)*PAD))){player.y=ny}for(const p of pickups){if(p.taken)continue;if(Math.hypot(p.x-player.x,p.y-player.y)>0.5)continue;p.taken=true;if(p.kind==='key'){player.hasKey=true;setMessage('GOT THE KEY')}else if(p.kind==='health'){player.hp=Math.min(100,player.hp+25);setMessage('HEALTH +25')}else if(p.kind==='ammo'){player.ammo+=12;setMessage('AMMO +12')}}const tile=mapAt(Math.floor(player.x),Math.floor(player.y));if(isExit(tile)){if(levelIdx<LEVELS.length-1){state=S.CLEAR}else{state=S.WIN}awaitingRelease=true}if(player.fireCooldown>0)player.fireCooldown-=dt;if(player.hurtFlash>0)player.hurtFlash-=dt;if(player.muzzleFlash>0)player.muzzleFlash-=dt;const wantFire=keys['Space']||firePending;firePending=false;if(wantFire&&player.fireCooldown<=0&&player.ammo>0){fireWeapon();player.fireCooldown=FIRE_RATE;player.muzzleFlash=0.08}}function fireWeapon(){player.ammo--;const dx=Math.cos(player.angle),dy=Math.sin(player.angle);let bestEnemy=null,bestDist=FIRE_RANGE;for(const e of enemies){if(!e.alive)continue;const ex=e.x-player.x,ey=e.y-player.y,dist=Math.hypot(ex,ey);if(dist>FIRE_RANGE)continue;if(!lineOfSight(player.x,player.y,e.x,e.y))continue;const ang=Math.atan2(ey,ex)-player.angle,angNorm=Math.atan2(Math.sin(ang),Math.cos(ang)),tolerance=0.18/Math.max(1,dist*0.6);if(Math.abs(angNorm)>tolerance)continue;if(dist<bestDist){bestDist=dist;bestEnemy=e}}if(bestEnemy){bestEnemy.hp-=FIRE_DAMAGE;bestEnemy.hurt=0.2;if(bestEnemy.hp<=0)bestEnemy.alive=false}}function updateEnemies(dt){for(const e of enemies){if(!e.alive)continue;if(e.hurt>0)e.hurt-=dt;e.cooldown-=dt;const def=ENEMY_DEFS[e.type],dx=player.x-e.x,dy=player.y-e.y,dist=Math.hypot(dx,dy);if(e.type==='H'){const canSee=dist<def.range&&lineOfSight(e.x,e.y,player.x,player.y);if(canSee){e.tx=player.x;e.ty=player.y;e.hunting=true}if(canSee&&dist<0.95){if(e.cooldown<=0){player.hp-=def.damage;player.hurtFlash=0.3;e.cooldown=def.fireDelay;if(player.hp<=0){player.hp=0;state=S.DEAD;awaitingRelease=true}}}else if(e.hunting){const ddx=e.tx-e.x,ddy=e.ty-e.y,d=Math.hypot(ddx,ddy);if(d>0.2){const sp=def.speed*dt,mx=ddx/d*sp,my=ddy/d*sp,EP=0.22;if(!isBlocking(mapAt(Math.floor(e.x+mx+Math.sign(mx)*EP),Math.floor(e.y))))e.x+=mx;if(!isBlocking(mapAt(Math.floor(e.x),Math.floor(e.y+my+Math.sign(my)*EP))))e.y+=my}else if(!canSee){e.hunting=false}}continue}if(dist>def.range)continue;if(!lineOfSight(e.x,e.y,player.x,player.y))continue;if(e.cooldown<=0){const hitChance=Math.max(0.25,1-dist/def.range*0.7);if(Math.random()<hitChance){player.hp-=def.damage;player.hurtFlash=0.3;if(player.hp<=0){player.hp=0;state=S.DEAD;awaitingRelease=true}}e.cooldown=def.fireDelay}}}const zBuffer=new Float32Array(PX_W);function clearFrame(){const horizon=Math.floor(PX_H/2),ceil=rgb(C.ceiling),floor=rgb(C.floor);for(let i=0;i<horizon*PX_W;i++)frame32[i]=ceil;for(let i=horizon*PX_W;i<PX_W*PX_H;i++)frame32[i]=floor}function castWalls(){for(let col=0;col<PX_W;col++){const cameraX=(2*col/PX_W)-1,rayAng=player.angle+Math.atan(cameraX*Math.tan(FOV/2));const dx=Math.cos(rayAng),dy=Math.sin(rayAng);let mapX=Math.floor(player.x),mapY=Math.floor(player.y);const deltaDistX=Math.abs(1/dx),deltaDistY=Math.abs(1/dy);let stepX,sideDistX,stepY,sideDistY;if(dx<0){stepX=-1;sideDistX=(player.x-mapX)*deltaDistX}else{stepX=1;sideDistX=(mapX+1-player.x)*deltaDistX}if(dy<0){stepY=-1;sideDistY=(player.y-mapY)*deltaDistY}else{stepY=1;sideDistY=(mapY+1-player.y)*deltaDistY}let hit=0,side=0,hitTile=0,dist=0;while(hit===0&&dist<MAX_DEPTH){if(sideDistX<sideDistY){sideDistX+=deltaDistX;mapX+=stepX;side=0;dist=sideDistX-deltaDistX}else{sideDistY+=deltaDistY;mapY+=stepY;side=1;dist=sideDistY-deltaDistY}const t=mapAt(mapX,mapY);if(isWall(t)){hit=1;hitTile=t}}if(hit===0){zBuffer[col]=MAX_DEPTH;continue}const perpDist=(side===0)?(sideDistX-deltaDistX):(sideDistY-deltaDistY);zBuffer[col]=perpDist;const lineH=Math.floor(PX_H/Math.max(0.0001,perpDist));let drawStart=Math.floor(-lineH/2+PX_H/2),drawEnd=Math.floor(lineH/2+PX_H/2);if(drawStart<0)drawStart=0;if(drawEnd>PX_H)drawEnd=PX_H;let palette;if(hitTile===1)palette=side===1?C.wallNS:C.wallEW;else if(hitTile===2)palette=side===1?C.wall2NS:C.wall2EW;else if(hitTile===9)palette=side===1?C.exitNS:C.exitEW;else palette=C.wallNS;const shade=Math.max(0.35,1-perpDist/14),r=Math.floor(palette[0]*shade),g=Math.floor(palette[1]*shade),b=Math.floor(palette[2]*shade),colour=(255<<24)|(b<<16)|(g<<8)|r;for(let y=drawStart;y<drawEnd;y++){frame32[y*PX_W+col]=colour}}}let lastT=0;function loop(t){const dt=Math.min(0.05,(t-lastT)/1000||0);lastT=t;if(state===S.PLAY){updatePlayer(dt);updateEnemies(dt);if(messageT>0)messageT-=dt}else if(state===S.DEAD||state===S.WIN||state===S.CLEAR){if(awaitingRelease){if(!keys['Space']&&!leftTouch&&!rightTouch&&!firePending)awaitingRelease=false}}render();requestAnimationFrame(loop)}function render(){clearFrame();if(state===S.PLAY||state===S.DEAD||state===S.WIN||state===S.CLEAR){castWalls()}pxCtx.putImageData(frame,0,0);if(state===S.MENU){pxCtx.fillStyle='#000';pxCtx.fillRect(0,0,PX_W,PX_H);pxCtx.fillStyle='#fff';pxCtx.font='bold 8px monospace';pxCtx.textAlign='center';pxCtx.fillText('WOLF',PX_W/2,30);pxCtx.fillText('FIND KEY & ESCAPE',PX_W/2,50);pxCtx.fillText('TAP TO START',PX_W/2,70)}else if(state===S.DEAD){pxCtx.fillStyle='rgba(0,0,0,0.7)';pxCtx.fillRect(0,0,PX_W,PX_H);pxCtx.fillStyle='#fff';pxCtx.font='bold 8px monospace';pxCtx.textAlign='center';pxCtx.fillText('YOU DIED',PX_W/2,PX_H/2);pxCtx.fillText('TAP RETRY',PX_W/2,PX_H/2+15)}else if(state===S.CLEAR){pxCtx.fillStyle='rgba(0,0,0,0.7)';pxCtx.fillRect(0,0,PX_W,PX_H);pxCtx.fillStyle='#0f0';pxCtx.font='bold 8px monospace';pxCtx.textAlign='center';pxCtx.fillText('FLOOR CLEAR',PX_W/2,PX_H/2);pxCtx.fillText('TAP NEXT',PX_W/2,PX_H/2+15)}else if(state===S.WIN){pxCtx.fillStyle='rgba(0,0,0,0.7)';pxCtx.fillRect(0,0,PX_W,PX_H);pxCtx.fillStyle='#0f0';pxCtx.font='bold 8px monospace';pxCtx.textAlign='center';pxCtx.fillText('ESCAPED',PX_W/2,PX_H/2);pxCtx.fillText('TAP REPLAY',PX_W/2,PX_H/2+15)}ctx.clearRect(0,0,PX_W*SCALE,PX_H*SCALE);ctx.drawImage(px,0,0,PX_W*SCALE,PX_H*SCALE)}requestAnimationFrame(loop)</script></body></html>
