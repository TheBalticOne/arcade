<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>TILT</title><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;background:#000;overflow:hidden}body{display:flex;align-items:center;justify-content:center}canvas{display:block;image-rendering:pixelated;touch-action:none}.menu-btn{position:fixed;top:8px;right:8px;padding:6px 12px;background:rgba(0,0,0,0.6);color:#fff;border:1px solid #888;border-radius:3px;font:12px monospace;cursor:pointer;z-index:9999}.menu-btn:hover{background:rgba(0,0,0,0.8)}</style></head><body><canvas id="c"></canvas><button class="menu-btn" onclick="window.location.href='../'">⊞ Menu</button><script>'use strict';const PX_W=240,PX_H=360;let SCALE=1;const px=document.createElement('canvas'),pxCtx=px.getContext('2d');px.width=PX_W;px.height=PX_H;pxCtx.imageSmoothingEnabled=false;const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),DPR=window.devicePixelRatio||1;function resize(){SCALE=Math.max(1,Math.min(window.innerWidth/PX_W,window.innerHeight/PX_H));canvas.width=Math.round(PX_W*SCALE*DPR);canvas.height=Math.round(PX_H*SCALE*DPR);canvas.style.width=Math.round(PX_W*SCALE)+'px';canvas.style.height=Math.round(PX_H*SCALE)+'px';ctx.setTransform(1,0,0,1,0,0);ctx.scale(DPR,DPR);ctx.imageSmoothingEnabled=false}window.addEventListener('resize',resize);window.addEventListener('orientationchange',resize);resize();const COL={woodA:'#8b5e3c',woodB:'#6b4424',woodEdge:'#3a1f0d',woodHi:'#c49a5a',wall:'#2a1808',wallTop:'#5a3a1c',wallShad:'#1a0c04',hole:'#0d0d0d',holeRim:'#2a1808',exit:'#4a7c3f',exitRim:'#2d4a1e',marble:'#c8c8d0',marbleHi:'#ffffff',marbleSh:'#5a5a68',hudBg:'#1a1008',hudText:'#f0d080',text:'#ffdd60',white:'#ffffff',red:'#e84040'};const CELL=16;const LEVELS=[[],[],[],[]];for(let l=0;l<4;l++){const lvl=[['###############','#S............#','#.###.#####.#.#','#...#.....#.#.#','###.#.###.#.#.#','#...#.#.#.#.#.#','#.###.#.#.#.#.#','#.#...#.#...#.#','#.#.###.#####.#','#.#...........#','#.###########.#','#............X#','###############'],[],[],[]][l];LEVELS[l]=lvl}let levelIdx=0,GRID,GRID_W,GRID_H,MAZE_X,MAZE_Y;const S={MENU:0,PERMISSION:1,PLAY:2,FAIL:3,WIN:4,COMPLETE:5};let state=S.MENU,awaitingRelease=false,permissionGranted=false;const MARBLE_R=5;let marble={x:0,y:0,vx:0,vy:0};const ACCEL_GAIN=280,FRICTION=0.985,FRICTION_PER_S=-Math.log(0.985)*60,WALL_BOUNCE=0.45,MAX_SPEED=220;const particles=[];function spawnParticles(x,y,count,color,spd,life,size){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,v=(0.4+Math.random()*0.6)*spd;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life,maxLife:life,size,color})}}function updateParticles(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}}function renderParticles(){for(const p of particles){if(p.life/p.maxLife<0.15)continue;pxCtx.fillStyle=p.color;pxCtx.fillRect(Math.round(p.x),Math.round(p.y),p.size,p.size)}}let tiltX=0,tiltY=0,calibrated=false,calibX=0,calibY=0;const TILT_FULL=25,TILT_DEAD=1.5;let rawBeta=0,rawGamma=0,tiltAvailable=false;function handleOrientation(e){if(e.beta==null||e.gamma==null)return;tiltAvailable=true;rawBeta=e.beta;rawGamma=e.gamma;if(!calibrated)return;const sa=(screen.orientation&&screen.orientation.angle)||window.orientation||0;let dx,dy;if(sa===0){dx=e.gamma-calibX;dy=e.beta-calibY}else if(sa===90){dx=-(e.beta-calibY);dy=e.gamma-calibX}else if(sa===-90||sa===270){dx=e.beta-calibY;dy=-(e.gamma-calibX)}else{dx=-(e.gamma-calibX);dy=-(e.beta-calibY)}dx=Math.abs(dx)<TILT_DEAD?0:dx>0?dx-TILT_DEAD:dx+TILT_DEAD;dy=Math.abs(dy)<TILT_DEAD?0:dy>0?dy-TILT_DEAD:dy+TILT_DEAD;tiltX=Math.max(-1,Math.min(1,dx/(TILT_FULL-TILT_DEAD)));tiltY=Math.max(-1,Math.min(1,dy/(TILT_FULL-TILT_DEAD)))}window.addEventListener('deviceorientation',handleOrientation);function calibrate(){calibX=rawGamma;calibY=rawBeta;calibrated=true}function checkNeedsPermission(){return typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'}const keys={};window.addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter'].includes(e.code))e.preventDefault()});window.addEventListener('keyup',e=>{keys[e.code]=false});function readKeyboardTilt(){let kx=0,ky=0;if(keys['ArrowLeft']||keys['KeyA'])kx-=1;if(keys['ArrowRight']||keys['KeyD'])kx+=1;if(keys['ArrowUp']||keys['KeyW'])ky-=1;if(keys['ArrowDown']||keys['KeyS'])ky+=1;return{x:kx,y:ky}}let permissionAttempted=false;canvas.addEventListener('touchstart',e=>{e.preventDefault();handleStartTap()},{passive:false});canvas.addEventListener('mousedown',e=>{e.preventDefault();handleStartTap()});function handleStartTap(){if(state===S.MENU){if(checkNeedsPermission()){permissionAttempted=true;try{DeviceOrientationEvent.requestPermission().then(result=>{if(result==='granted'){permissionGranted=true;startLevel(0)}else{permissionGranted=false;state=S.PERMISSION}}).catch(()=>{permissionGranted=false;state=S.PERMISSION})}catch(err){permissionGranted=false;state=S.PERMISSION}return}permissionGranted=true;startLevel(0);return}if(state===S.PERMISSION&&!awaitingRelease){if(checkNeedsPermission()){try{DeviceOrientationEvent.requestPermission().then(result=>{if(result==='granted'){permissionGranted=true;startLevel(0)}}).catch(()=>{})}catch(err){}}return}if(state===S.FAIL&&!awaitingRelease){startLevel(levelIdx);return}if(state===S.WIN&&!awaitingRelease){if(levelIdx+1<LEVELS.length)startLevel(levelIdx+1);else{state=S.COMPLETE;awaitingRelease=true}return}if(state===S.COMPLETE&&!awaitingRelease){startLevel(0);return}}window.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&!awaitingRelease)handleStartTap()});function startLevel(idx){levelIdx=idx;GRID=LEVELS[idx];GRID_H=GRID.length;GRID_W=GRID[0].length;const HUD=18;MAZE_X=Math.floor((PX_W-GRID_W*CELL)/2);MAZE_Y=HUD+Math.floor((PX_H-HUD-GRID_H*CELL)/2);for(let r=0;r<GRID_H;r++)for(let c=0;c<GRID_W;c++)if(GRID[r][c]==='S'){marble.x=MAZE_X+c*CELL+CELL/2;marble.y=MAZE_Y+r*CELL+CELL/2}marble.vx=0;marble.vy=0;particles.length=0;awaitingRelease=false;calibrate();state=S.PLAY}function cellAt(px_,py_){const cx=Math.floor((px_-MAZE_X)/CELL),cy=Math.floor((py_-MAZE_Y)/CELL);if(cx<0||cx>=GRID_W||cy<0||cy>=GRID_H)return'#';return GRID[cy][cx]}function isWallCell(ch){return ch==='#'}function collideCircle(cx,cy,r){let bouncedX=false,bouncedY=false;const minCX=Math.floor((cx-r-MAZE_X)/CELL),maxCX=Math.floor((cx+r-MAZE_X)/CELL),minCY=Math.floor((cy-r-MAZE_Y)/CELL),maxCY=Math.floor((cy+r-MAZE_Y)/CELL);for(let gy=minCY;gy<=maxCY;gy++){for(let gx=minCX;gx<=maxCX;gx++){if(gx<0||gx>=GRID_W||gy<0||gy>=GRID_H)continue;if(!isWallCell(GRID[gy][gx]))continue;const rx1=MAZE_X+gx*CELL,ry1=MAZE_Y+gy*CELL,rx2=rx1+CELL,ry2=ry1+CELL;const px_=Math.max(rx1,Math.min(cx,rx2)),py_=Math.max(ry1,Math.min(cy,ry2));const dx=cx-px_,dy=cy-py_,d2=dx*dx+dy*dy;if(d2>=r*r)continue;const d=Math.sqrt(d2)||0.0001,overlap=r-d,nx=dx/d,ny=dy/d;cx+=nx*overlap;cy+=ny*overlap;if(Math.abs(nx)>Math.abs(ny))bouncedX=true;else bouncedY=true}}return{x:cx,y:cy,bouncedX,bouncedY}}function updateMarble(dt){let inX=tiltX,inY=tiltY;if(!tiltAvailable){const k=readKeyboardTilt();inX=k.x;inY=k.y}else{const k=readKeyboardTilt();if(k.x!==0)inX=k.x;if(k.y!==0)inY=k.y}marble.vx+=inX*ACCEL_GAIN*dt;marble.vy+=inY*ACCEL_GAIN*dt;const f=Math.exp(-FRICTION_PER_S*dt);marble.vx*=f;marble.vy*=f;const sp=Math.hypot(marble.vx,marble.vy);if(sp>MAX_SPEED){marble.vx=marble.vx/sp*MAX_SPEED;marble.vy=marble.vy/sp*MAX_SPEED}const stepDist=sp*dt,subSteps=Math.max(1,Math.ceil(stepDist/(MARBLE_R*0.6))),subDt=dt/subSteps;for(let s=0;s<subSteps;s++){marble.x+=marble.vx*subDt;marble.y+=marble.vy*subDt;const r=collideCircle(marble.x,marble.y,MARBLE_R);marble.x=r.x;marble.y=r.y;if(r.bouncedX)marble.vx=-marble.vx*WALL_BOUNCE;if(r.bouncedY)marble.vy=-marble.vy*WALL_BOUNCE}const ch=cellAt(marble.x,marble.y);if(ch==='O'){const cx_=Math.floor((marble.x-MAZE_X)/CELL),cy_=Math.floor((marble.y-MAZE_Y)/CELL);const holeCx=MAZE_X+cx_*CELL+CELL/2,holeCy=MAZE_Y+cy_*CELL+CELL/2;const d=Math.hypot(marble.x-holeCx,marble.y-holeCy);if(d<CELL*0.32){spawnParticles(marble.x,marble.y,12,COL.holeRim,30,0.5,1);awaitingRelease=true;state=S.FAIL}}else if(ch==='X'){const cx_=Math.floor((marble.x-MAZE_X)/CELL),cy_=Math.floor((marble.y-MAZE_Y)/CELL);const exitCx=MAZE_X+cx_*CELL+CELL/2,exitCy=MAZE_Y+cy_*CELL+CELL/2;const d=Math.hypot(marble.x-exitCx,marble.y-exitCy);if(d<CELL*0.32){spawnParticles(marble.x,marble.y,20,COL.exit,50,0.7,2);awaitingRelease=true;state=S.WIN}}}let lastT=0;function loop(t){const dt=Math.min(0.05,(t-lastT)/1000||0);lastT=t;if(state===S.PLAY){updateMarble(dt);updateParticles(dt)}else{updateParticles(dt);if(awaitingRelease){const anyKey=keys['Space']||keys['Enter'];if(!anyKey)awaitingRelease=false}}render();requestAnimationFrame(loop)}function render(){pxCtx.fillStyle=COL.woodA;pxCtx.fillRect(0,0,PX_W,PX_H);pxCtx.fillStyle=COL.woodB;for(let y=0;y<PX_H;y+=3){if((y*7919)%9<2){for(let x=0;x<PX_W;x++){if((x*13+y*31)%11<3)pxCtx.fillRect(x,y,1,1)}}}pxCtx.fillStyle=COL.woodEdge;pxCtx.fillRect(0,0,PX_W,2);pxCtx.fillRect(0,PX_H-2,PX_W,2);pxCtx.fillRect(0,0,2,PX_H);pxCtx.fillRect(PX_W-2,0,2,PX_H);if(state===S.MENU){drawHUD();drawOverlay('TILT','TILT YOUR DEVICE','TAP / SPACE TO START');pushFrame();return}if(state===S.PERMISSION){drawHUD();drawOverlay('PERMISSION','TILT ACCESS NEEDED','TAP TO TRY AGAIN');pushFrame();return}drawMaze();renderParticles();drawMarble();drawHUD();if(state===S.FAIL){drawOverlay('OOPS','LEVEL '+(levelIdx+1),'TAP TO RETRY')}else if(state===S.WIN){if(levelIdx+1<LEVELS.length){drawOverlay('CLEARED','LEVEL '+(levelIdx+1),'TAP FOR NEXT')}else{drawOverlay('CLEARED','FINAL LEVEL','TAP TO FINISH')}}else if(state===S.COMPLETE){drawOverlay('COMPLETE','ALL LEVELS BEAT','TAP TO RESTART')}pushFrame()}function pushFrame(){ctx.clearRect(0,0,canvas.width/DPR,canvas.height/DPR);ctx.drawImage(px,0,0,Math.round(PX_W*SCALE),Math.round(PX_H*SCALE))}function drawMaze(){for(let r=0;r<GRID_H;r++){for(let c=0;c<GRID_W;c++){const ch=GRID[r][c],x=MAZE_X+c*CELL,y=MAZE_Y+r*CELL;if(ch==='#'){pxCtx.fillStyle=COL.wallTop;pxCtx.fillRect(x,y,CELL,CELL);pxCtx.fillStyle=COL.wall;pxCtx.fillRect(x,y+CELL-3,CELL,3);pxCtx.fillStyle=COL.woodHi;pxCtx.fillRect(x,y,CELL,1);pxCtx.fillStyle=COL.wallShad;pxCtx.fillRect(x,y+CELL-1,CELL,1)}else{pxCtx.fillStyle=COL.woodB;pxCtx.fillRect(x,y,CELL,CELL);pxCtx.fillStyle=COL.woodEdge;pxCtx.fillRect(x,y,CELL,1);pxCtx.fillRect(x,y,1,CELL);pxCtx.fillStyle=COL.woodA;pxCtx.fillRect(x,y+CELL-1,CELL,1);pxCtx.fillRect(x+CELL-1,y,1,CELL);if(ch==='O'||ch==='X')drawHole(x,y,ch==='X')}}}}function drawHole(x,y,isExit){const cx=x+CELL/2,cy=y+CELL/2,r=Math.floor(CELL*0.34);for(let dy=-r-1;dy<=r+1;dy++){for(let dx=-r-1;dx<=r+1;dx++){const d2=dx*dx+dy*dy;if(d2<=(r+1)*(r+1)&&d2>r*r){pxCtx.fillStyle=isExit?COL.exitRim:COL.holeRim;pxCtx.fillRect(Math.round(cx+dx),Math.round(cy+dy),1,1)}else if(d2<=r*r){pxCtx.fillStyle=isExit?COL.exit:COL.hole;pxCtx.fillRect(Math.round(cx+dx),Math.round(cy+dy),1,1)}}}if(isExit){const phase=Math.floor(performance.now()/250)%2;if(phase===0){pxCtx.fillStyle=COL.white;pxCtx.fillRect(Math.round(cx)-1,Math.round(cy)-1,2,2)}}}function drawMarble(){const cx=Math.round(marble.x),cy=Math.round(marble.y),r=MARBLE_R;pxCtx.fillStyle=COL.wallShad;for(let dy=-r;dy<=r;dy++){for(let dx=-r;dx<=r;dx++){if(dx*dx+dy*dy<=r*r){pxCtx.fillRect(cx+dx,cy+dy+2,1,1)}}}for(let dy=-r;dy<=r;dy++){for(let dx=-r;dx<=r;dx++){const d2=dx*dx+dy*dy;if(d2>r*r)continue;let col;if(d2<(r-2)*(r-2)&&dx<=0&&dy<=0)col=COL.marbleHi;else if(d2>(r-1)*(r-1))col=COL.marbleSh;else col=COL.marble;pxCtx.fillStyle=col;pxCtx.fillRect(cx+dx,cy+dy,1,1)}}}function drawHUD(){const HUD=14;pxCtx.fillStyle=COL.hudBg;pxCtx.fillRect(0,0,PX_W,HUD);pxCtx.fillStyle=COL.woodEdge;pxCtx.fillRect(0,HUD-1,PX_W,1);pxCtx.font='bold 8px monospace';pxCtx.fillStyle=COL.hudText;pxCtx.textAlign='left';pxCtx.fillText('TILT',4,9);pxCtx.textAlign='center';if(state===S.PLAY||state===S.FAIL||state===S.WIN){pxCtx.fillText('LEVEL '+(levelIdx+1)+'/'+LEVELS.length,PX_W/2,9)}pxCtx.textAlign='right';if(!tiltAvailable&&state===S.PLAY){pxCtx.fillText('KEYS',PX_W-4,9)}else if(tiltAvailable&&state===S.PLAY){pxCtx.fillText('TILT',PX_W-4,9)}pxCtx.textAlign='center'}function drawOverlay(title,subtitle,cta){const w=PX_W-60,h=70,x=30,y=(PX_H-h)/2;pxCtx.fillStyle='#000';pxCtx.fillRect(x,y,w,h);pxCtx.fillStyle='#fff';pxCtx.fillRect(x,y,w,1);pxCtx.fillRect(x,y+h-1,w,1);pxCtx.fillRect(x,y,1,h);pxCtx.fillRect(x+w-1,y,1,h);pxCtx.textAlign='center';pxCtx.font='bold 12px monospace';pxCtx.fillStyle=COL.text;pxCtx.fillText(title,PX_W/2,y+20);if(subtitle){pxCtx.font='8px monospace';pxCtx.fillStyle='#aaa';pxCtx.fillText(subtitle,PX_W/2,y+36)}if(cta){pxCtx.font='8px monospace';pxCtx.fillStyle=COL.text;pxCtx.fillText(cta,PX_W/2,y+56)}}requestAnimationFrame(loop)</script></body></html>
