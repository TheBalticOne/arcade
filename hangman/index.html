<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>HANGMAN</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: #0d0d0d; color: #eee; font-family: monospace; overflow: hidden;
         display: flex; flex-direction: column; align-items: center;
         padding: 52px 8px calc(12px + env(safe-area-inset-bottom)); user-select: none;
         -webkit-user-select: none; touch-action: manipulation; }
  .menu-btn { position: fixed; top: 12px; right: 12px; z-index: 1000; padding: 8px 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: #fff; cursor: pointer; font-size: 12px; border-radius: 4px; font-family: monospace; }
  .menu-btn:active { background: rgba(255,255,255,0.2); }
  .back-btn { position: fixed; top: 12px; right: 96px; z-index: 400; padding: 8px 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: #fff; font-size: 12px; border-radius: 4px; font-family: monospace; }
  .back-btn:active { background: rgba(255,255,255,0.2); }
  .hud { position: fixed; top: 12px; left: 12px; font-size: 12px; line-height: 1.5; color: #aaa; }
  .hud b { color: #ffd166; }
  #cat { font-size: 14px; letter-spacing: 3px; color: #8ecae6; margin-bottom: 6px; text-transform: uppercase; }
  svg { width: min(60vw, 34vh); height: auto; flex-shrink: 1; }
  svg .p { stroke: #eee; stroke-width: 4; stroke-linecap: round; fill: none; visibility: hidden; }
  svg .p.on { visibility: visible; }
  svg .g { stroke: #8b5e3c; stroke-width: 6; stroke-linecap: round; fill: none; }
  #word { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 14px 0 8px;
          max-width: 560px; }
  #word span { width: 1.4em; border-bottom: 3px solid #555; text-align: center;
               font-size: clamp(20px, 7vw, 34px); font-weight: bold; line-height: 1.3; }
  #word span.sp { border: none; width: .6em; }
  #word span.miss { color: #ff6b6b; }
  #msg { height: 1.6em; font-size: 16px; margin-bottom: 6px; }
  #msg.win { color: #7ab648; } #msg.lose { color: #ff6b6b; }
  #keys { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 560px; margin-top: auto; }
  .row { display: flex; gap: 5px; justify-content: center; }
  .row button { flex: 1; max-width: 50px; height: 48px; font: bold 18px monospace; color: #eee;
                background: #2a2a3a; border: 1px solid #444; border-radius: 6px; }
  .row button:active { background: #3a3a55; }
  .row button.hit { background: #2d4a1e; color: #c8e86b; border-color: #4a7c3f; }
  .row button.no { background: #1a1a1a; color: #555; border-color: #222; }
  #next { display: none; margin: 4px 0 10px; padding: 12px 28px; font: bold 16px monospace;
          background: #ffd166; color: #222; border: none; border-radius: 6px; }
  #next.show { display: block; }
  .screen { position: fixed; inset: 0; background: #0d0d0d; z-index: 500; display: none;
            flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; }
  .screen.show { display: flex; }
  .screen h1 { font-size: 32px; letter-spacing: 6px; color: #ffd166; margin-bottom: 10px; }
  .screen p { color: #aaa; font-size: 13px; text-align: center; max-width: 300px; }
  .screen button { width: 240px; padding: 14px; font: bold 16px monospace; border: none; border-radius: 6px;
                   background: #ffd166; color: #222; }
  .screen button.alt { background: #2a2a3a; color: #eee; border: 1px solid #444; }
  .screen input { width: 240px; padding: 12px; font: bold 18px monospace; text-transform: uppercase;
                  background: #1a1a2e; color: #eee; border: 1px solid #444; border-radius: 6px; text-align: center; }
  #err { color: #ff6b6b; font-size: 13px; height: 1.2em; }
</style>
</head>
<body>
<button class="menu-btn" onclick="window.location.href='../'">⊞ Menu</button>
<div class="screen show" id="menu">
  <h1>HANGMAN</h1>
  <button id="soloBtn">RANDOM WORD</button>
  <button class="alt" id="passBtn">PASS &amp; PLAY</button>
  <p>Pass &amp; play: type a secret word, then hand the phone to a friend to guess.</p>
</div>
<div class="screen" id="setup">
  <h1>SECRET WORD</h1>
  <p>Don't let your friend see!</p>
  <input id="secret" type="password" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="30" placeholder="WORD OR PHRASE">
  <input id="hint" type="text" autocomplete="off" spellcheck="false" maxlength="24" placeholder="HINT (OPTIONAL)">
  <div id="err"></div>
  <button id="goBtn">HIDE &amp; PASS</button>
  <button class="alt" id="backBtn">BACK</button>
</div>
<button class="back-btn" id="modesBtn">◀ Modes</button>
<div class="hud">STREAK <b id="streak">0</b><br>BEST <b id="best">0</b></div>
<div id="cat"></div>
<svg viewBox="0 0 200 220">
  <path class="g" d="M20 210 H120 M50 210 V15 H140 V35 M50 50 L85 15"/>
  <circle class="p" cx="140" cy="55" r="20"/>
  <path class="p" d="M140 75 V140"/>
  <path class="p" d="M140 90 L112 120"/>
  <path class="p" d="M140 90 L168 120"/>
  <path class="p" d="M140 140 L116 182"/>
  <path class="p" d="M140 140 L164 182"/>
</svg>
<div id="word"></div>
<div id="msg"></div>
<button id="next">NEXT WORD</button>
<div id="keys"></div>
<script>
'use strict';

const WORDS = {
  'Animals of the World': 'ELEPHANT GIRAFFE PENGUIN KANGAROO CROCODILE OCTOPUS DOLPHIN CHEETAH HEDGEHOG SQUIRREL BUTTERFLY TORTOISE ZEBRA GORILLA FLAMINGO PORCUPINE RHINOCEROS JELLYFISH OSTRICH BADGER WALRUS PANTHER LOBSTER SCORPION PEACOCK HAMSTER BEAVER CHIMPANZEE ARMADILLO MEERKAT',
  'Food & Dishes': 'SPAGHETTI PANCAKE AVOCADO BROCCOLI CHOCOLATE SANDWICH PINEAPPLE CROISSANT LASAGNE BURRITO PRETZEL DOUGHNUT RISOTTO CUCUMBER MUSHROOM PAPRIKA CINNAMON BLUEBERRY CHEESECAKE OMELETTE DUMPLING PISTACHIO WATERMELON TOMATO PORRIDGE CRUMPET MACARONI SAUSAGE TRIFLE MARMALADE',
  'Countries of the World': 'ARGENTINA AUSTRALIA BRAZIL CANADA DENMARK ESTONIA FINLAND GERMANY HUNGARY ICELAND JAPAN KENYA LATVIA LITHUANIA MEXICO NORWAY PORTUGAL ROMANIA SWEDEN THAILAND URUGUAY VIETNAM ZIMBABWE MOROCCO NEW_ZEALAND SOUTH_AFRICA SWITZERLAND GREECE POLAND IRELAND',
  'Science & Nature': 'MOLECULE NEUTRON GRAVITY ENZYME PROTEIN MITOCHONDRIA CHROMOSOME TELESCOPE MAGNET VOLCANO ATMOSPHERE PHOTOSYNTHESIS ANTIBODY BACTERIA ELECTRON HYDROGEN NUCLEUS OXYGEN PLANKTON FOSSIL GALAXY ASTEROID MACROPHAGE RIBOSOME CATALYST ISOTOPE VACCINE MICROSCOPE PLASMA GENOME',
  'Sports & Pastimes': 'BADMINTON BASKETBALL CRICKET CYCLING FENCING FOOTBALL GYMNASTICS HOCKEY JAVELIN KAYAKING MARATHON ROWING RUGBY SKATEBOARD SNOOKER SQUASH SURFING SWIMMING TENNIS TRIATHLON VOLLEYBALL WRESTLING ARCHERY BOXING CLIMBING DARTS GOLF ROUNDERS SAILING SKIING',
  'Around the House': 'UMBRELLA TELEPHONE TEAPOT KEYBOARD TOASTER SUITCASE CUSHION TOOTHBRUSH SCISSORS CALENDAR SAUCEPAN CURTAINS WARDROBE CANDLE BLANKET BOOKSHELF RADIATOR KETTLE LADDER MIRROR DISHWASHER PILLOW SOFA DOORMAT THERMOSTAT FRIDGE BATHTUB SPATULA COLANDER CARPET',
};
const MAX_MISSES = 6;
const parts = document.querySelectorAll('svg .p');
const wordEl = document.getElementById('word');
const msgEl = document.getElementById('msg');
const nextBtn = document.getElementById('next');
const keyBtns = {};

let answer, guessed, misses, over;
let mode = 'solo';
let streak = 0;
let best = +(localStorage.getItem('hangman-best') || 0);
document.getElementById('best').textContent = best;

// On-screen keyboard
for (const row of ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM']) {
  const r = document.createElement('div');
  r.className = 'row';
  for (const ch of row) {
    const b = document.createElement('button');
    b.textContent = ch;
    b.onclick = () => guess(ch);
    keyBtns[ch] = b;
    r.appendChild(b);
  }
  document.getElementById('keys').appendChild(r);
}

function newWord() {
  if (mode === 'pass') return showSetup();
  const cats = Object.keys(WORDS);
  const cat = cats[Math.floor(Math.random() * cats.length)];
  const list = WORDS[cat].split(' ');
  start(list[Math.floor(Math.random() * list.length)].replace(/_/g, ' '), cat);
}

function start(word, cat) {
  answer = word;
  guessed = new Set();
  misses = 0;
  over = false;
  document.getElementById('cat').textContent = cat;
  document.querySelector('.hud').style.visibility = mode === 'solo' ? 'visible' : 'hidden';
  msgEl.textContent = '';
  msgEl.className = '';
  nextBtn.classList.remove('show');
  parts.forEach(p => p.classList.remove('on'));
  for (const b of Object.values(keyBtns)) b.className = '';
  render();
}

function render(reveal) {
  wordEl.innerHTML = '';
  for (const ch of answer) {
    const s = document.createElement('span');
    if (ch === ' ') s.className = 'sp';
    else if (guessed.has(ch)) s.textContent = ch;
    else if (reveal) { s.textContent = ch; s.className = 'miss'; }
    wordEl.appendChild(s);
  }
}

function guess(ch) {
  if (over || guessed.has(ch)) return;
  guessed.add(ch);
  if (answer.includes(ch)) {
    keyBtns[ch].className = 'hit';
  } else {
    keyBtns[ch].className = 'no';
    parts[misses++].classList.add('on');
  }
  const won = [...answer].every(c => c === ' ' || guessed.has(c));
  const lost = misses >= MAX_MISSES;
  render(lost);
  if (won || lost) end(won);
}

function end(won) {
  over = true;
  if (mode === 'solo') streak = won ? streak + 1 : 0;
  if (streak > best) { best = streak; localStorage.setItem('hangman-best', best); }
  document.getElementById('streak').textContent = streak;
  document.getElementById('best').textContent = best;
  msgEl.textContent = won ? 'YOU GOT IT!' : 'HANGED!';
  msgEl.className = won ? 'win' : 'lose';
  nextBtn.classList.add('show');
}

const $ = id => document.getElementById(id);
function showSetup() {
  $('secret').value = '';
  $('hint').value = '';
  $('err').textContent = '';
  $('setup').classList.add('show');
  $('secret').focus();
}
function startPass() {
  const word = $('secret').value.toUpperCase().trim().replace(/\s+/g, ' ');
  if (!/^[A-Z ]+$/.test(word) || word.replace(/ /g, '').length < 2) {
    $('err').textContent = 'Letters only, at least 2';
    return;
  }
  $('secret').blur();
  $('hint').blur();
  $('setup').classList.remove('show');
  start(word, $('hint').value.trim() || "FRIEND'S WORD");
}
$('soloBtn').onclick = () => { mode = 'solo'; $('menu').classList.remove('show'); newWord(); };
$('passBtn').onclick = () => { mode = 'pass'; $('menu').classList.remove('show'); showSetup(); };
$('goBtn').onclick = startPass;
$('modesBtn').onclick = () => { over = true; $('menu').classList.add('show'); };
$('backBtn').onclick = () => { $('setup').classList.remove('show'); $('menu').classList.add('show'); };
$('secret').addEventListener('keydown', e => { if (e.key === 'Enter') $('hint').focus(); });
$('hint').addEventListener('keydown', e => { if (e.key === 'Enter') startPass(); });

nextBtn.onclick = newWord;
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || document.querySelector('.screen.show')) return;
  if (e.key === 'Enter' && over) return newWord();
  const ch = e.key.toUpperCase();
  if (/^[A-Z]$/.test(ch)) guess(ch);
});

</script>
</body>
</html>
