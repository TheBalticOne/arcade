<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PONG</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; align-items: center;
         justify-content: center; height: 100vh; overflow: hidden; }
  canvas { display: block; }
  .menu-btn { position: fixed; top: 12px; right: 12px; z-index: 1000; padding: 8px 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: #fff; cursor: pointer; font-size: 12px; border-radius: 4px; font-family: monospace; }
  .menu-btn:active { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
<button class="menu-btn" onclick="window.location.href='../'">⊞ Menu</button>
<canvas id="c"></canvas>
<script>
'use strict';

// --- Canvas setup (HiDPI) ---
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const DPR    = window.devicePixelRatio || 1;
let W, H;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(DPR, DPR);
  // Reposition paddles on resize
  if (left)  { left.x  = PAD_MARGIN; left.y  = H / 2 - PAD_H / 2; }
  if (right) { right.x = W - PAD_MARGIN - PAD_W; right.y = H / 2 - PAD_H / 2; }
  if (ball)  resetBall();
}
window.addEventListener('resize', resize);

// --- State machine ---
const S = { MENU: 0, PLAY: 1, SCORED: 2 };
let state = S.MENU;

// --- Input ---
const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
window.addEventListener('keyup',   e => { keys[e.code] = false; });

// Touch: track left/right half independently for two-finger play
const touches = {};
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) touches[t.identifier] = { x: t.clientX, y: t.clientY };
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) touches[t.identifier] = { x: t.clientX, y: t.clientY };
}, { passive: false });
canvas.addEventListener('touchend', e => {
  for (const t of e.changedTouches) delete touches[t.identifier];
});

// Return the Y position of whichever touch is in the given screen half, or null
function touchY(side) {
  for (const id in touches) {
    const t = touches[id];
    if (side === 'left'  && t.x < W / 2) return t.y;
    if (side === 'right' && t.x > W / 2) return t.y;
  }
  return null;
}

// --- Constants ---
const PAD_W      = 12;
const PAD_H      = 80;
const PAD_MARGIN = 24;
const PAD_SPEED  = 480;   // px/s
const BALL_R     = 8;
const WIN_SCORE  = 7;
const AI_SPEED   = 340;   // CPU paddle speed

// --- Game objects ---
let left, right, ball;
let scoreL = 0, scoreR = 0;
let scoredSide = null;      // 'left' | 'right', used during SCORED pause
let pauseTimer = 0;

function makePad(x, y) {
  return { x, y, w: PAD_W, h: PAD_H };
}

function resetBall(towardSide) {
  const angle  = (Math.random() * 0.6 - 0.3); // -0.3 to 0.3 rad
  const speed  = 320 + Math.min(scoreL + scoreR, 8) * 20; // escalates slightly
  const dir    = towardSide === 'left' ? -1 : 1;
  ball = {
    x:  W / 2,
    y:  H / 2,
    vx: Math.cos(angle) * speed * dir,
    vy: Math.sin(angle) * speed
  };
}

function init() {
  left  = makePad(PAD_MARGIN, H / 2 - PAD_H / 2);
  right = makePad(W - PAD_MARGIN - PAD_W, H / 2 - PAD_H / 2);
  scoreL = 0;
  scoreR = 0;
  resetBall(Math.random() < 0.5 ? 'left' : 'right');
}

// Call resize after init so pad positions are set
resize();
init();

// --- Game loop ---
let lastT = 0;

function loop(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0);
  lastT = t;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

function update(dt) {
  switch (state) {
    case S.MENU:   updateMenu(dt);   break;
    case S.PLAY:   updatePlay(dt);   break;
    case S.SCORED: updateScored(dt); break;
  }
}

function render() {
  ctx.clearRect(0, 0, W, H);
  switch (state) {
    case S.MENU:   renderMenu();   break;
    case S.PLAY:   renderGame();   break;
    case S.SCORED: renderGame();   break;
  }
}

// --- MENU ---
function updateMenu(dt) {
  if (keys['Space'] || keys['Enter'] || Object.keys(touches).length) {
    keys['Space'] = keys['Enter'] = false;
    init();
    state = S.PLAY;
  }
}

function renderMenu() {
  renderGame();
  drawOverlay('PONG', 'Left: W/S   Right: UP/DN', 'PRESS SPACE TO START');
}

// --- PLAY ---
function updatePlay(dt) {
  movePad(left,  'left',  dt);
  movePad(right, 'right', dt);
  moveBall(dt);
}

function movePad(pad, side, dt) {
  let dy = 0;

  if (side === 'left') {
    if (keys['KeyW']) dy = -1;
    if (keys['KeyS']) dy =  1;
    const ty = touchY('left');
    if (ty !== null) dy = ty < pad.y + pad.h / 2 ? -1 : 1;
  } else {
    // Right paddle: keyboard or simple CPU tracking if no input
    const ty = touchY('right');
    if (keys['ArrowUp'])   dy = -1;
    if (keys['ArrowDown']) dy =  1;
    if (ty !== null) dy = ty < pad.y + pad.h / 2 ? -1 : 1;

    // CPU takes over right side only if there is no human input on that side
    if (dy === 0) {
      const center = pad.y + pad.h / 2;
      if (ball.y < center - 4) dy = -1;
      if (ball.y > center + 4) dy =  1;
      // Limit CPU speed so it is beatable
      pad.y += dy * AI_SPEED * dt;
      pad.y  = Math.max(0, Math.min(H - pad.h, pad.y));
      return;
    }
  }

  pad.y += dy * PAD_SPEED * dt;
  pad.y  = Math.max(0, Math.min(H - pad.h, pad.y));
}

function moveBall(dt) {
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;

  // Top / bottom walls
  if (ball.y - BALL_R < 0) {
    ball.y = BALL_R;
    ball.vy = Math.abs(ball.vy);
  }
  if (ball.y + BALL_R > H) {
    ball.y = H - BALL_R;
    ball.vy = -Math.abs(ball.vy);
  }

  // Paddle collisions
  if (hitPad(ball, left)  && ball.vx < 0) reflect(ball, left);
  if (hitPad(ball, right) && ball.vx > 0) reflect(ball, right);

  // Score
  if (ball.x - BALL_R < 0) {
    scoreR++;
    scored('right');
  }
  if (ball.x + BALL_R > W) {
    scoreL++;
    scored('left');
  }
}

function hitPad(b, pad) {
  return b.x + BALL_R > pad.x &&
         b.x - BALL_R < pad.x + pad.w &&
         b.y + BALL_R > pad.y &&
         b.y - BALL_R < pad.y + pad.h;
}

function reflect(b, pad) {
  // Angle based on where ball hits relative to paddle centre
  const relY   = (b.y - (pad.y + pad.h / 2)) / (pad.h / 2);
  const angle  = relY * (Math.PI / 4);          // max 45 deg
  const speed  = Math.hypot(b.vx, b.vy) * 1.04; // slight speedup per hit
  const dir    = b.vx < 0 ? 1 : -1;
  b.vx = Math.cos(angle) * speed * dir;
  b.vy = Math.sin(angle) * speed;
}

function scored(side) {
  scoredSide = side;
  pauseTimer = 1.2;
  if (scoreL >= WIN_SCORE || scoreR >= WIN_SCORE) {
    pauseTimer = 3;
  }
  state = S.SCORED;
}

// --- SCORED (brief pause between points) ---
function updateScored(dt) {
  pauseTimer -= dt;
  if (pauseTimer <= 0) {
    if (scoreL >= WIN_SCORE || scoreR >= WIN_SCORE) {
      init();
      state = S.MENU;
    } else {
      resetBall(scoredSide === 'left' ? 'right' : 'left'); // serve toward scorer
      state = S.PLAY;
    }
  }
}

// --- Render ---
function renderGame() {
  // Background
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // Centre dashes
  ctx.setLineDash([10, 14]);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W / 2, 0);
  ctx.lineTo(W / 2, H);
  ctx.stroke();
  ctx.setLineDash([]);

  // Paddles
  ctx.fillStyle = '#fff';
  ctx.fillRect(left.x,  left.y,  left.w,  left.h);
  ctx.fillRect(right.x, right.y, right.w, right.h);

  // Ball
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
  ctx.fill();

  // Score
  ctx.font = 'bold 48px monospace';
  ctx.fillStyle = '#555';
  ctx.textAlign = 'right';
  ctx.fillText(scoreL, W / 2 - 24, 64);
  ctx.textAlign = 'left';
  ctx.fillText(scoreR, W / 2 + 24, 64);

  // Scored flash
  if (state === S.SCORED) {
    const winner = scoreL >= WIN_SCORE ? 'LEFT' : scoreR >= WIN_SCORE ? 'RIGHT' : null;
    if (winner) {
      drawOverlay(winner + ' WINS', 'First to ' + WIN_SCORE, '');
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fillRect(scoredSide === 'left' ? 0 : W / 2, 0, W / 2, H);
    }
  }
}

// --- Overlay helper (from skill) ---
function drawOverlay(title, subtitle, cta) {
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';

  ctx.font = 'bold 48px monospace';
  ctx.fillStyle = '#fff';
  ctx.fillText(title, W / 2, H / 2 - 40);

  if (subtitle) {
    ctx.font = '20px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText(subtitle, W / 2, H / 2 + 10);
  }

  if (cta) {
    ctx.font = '16px monospace';
    ctx.fillStyle = '#ff0';
    ctx.fillText(cta, W / 2, H / 2 + 50);
  }
}

requestAnimationFrame(loop);
</script>
</body>
</html>
